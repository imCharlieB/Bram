[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bram-core"
version = "0.19.0"
description = "BRAM Server"
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = ["aiohttp>=3.11,<4", "av>=14", "cryptography>=43", "httpx>=0.27,<1", "numpy", "segno>=1.6", "tzdata"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff>=0.5"]

[project.scripts]
bram-bench = "bram.bench.cli:main"
bram-server = "bram.server:main"

[tool.setuptools.packages.find]
include = ["bram*"]

[tool.setuptools.package-data]
bram = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
