name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e "server[dev]" pytest-github-actions-annotate-failures
      - run: ruff check .
      - run: pytest server/tests
      - run: python scripts/rule_coverage.py
      - run: python scripts/docs_check.py
      - run: python scripts/version_check.py
  home-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install pytest-homeassistant-custom-component==0.13.375 pytest-github-actions-annotate-failures
      - run: pip install -e server
      - run: python -m pytest ha_tests -o asyncio_mode=auto
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose -f compose.yaml -f compose.build.yaml build
      - run: docker compose -f compose.yaml -f compose.build.yaml run --rm bram pair --name CI
      - name: ntfy allows only BRAM topics
        run: |
          docker compose up -d ntfy
          for i in $(seq 20); do curl -fs localhost:2586/v1/health && break; sleep 1; done
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          test "$(code -d hi localhost:2586/bram-test)" = 200
          test "$(code 'localhost:2586/bram-test/json?poll=1')" = 200
          test "$(code -d hi localhost:2586/other)" = 403
          test "$(code 'localhost:2586/other/json?poll=1')" = 403
          test "$(code -H 'Content-Type: application/json' -d '{"topic":"other","message":"x"}' localhost:2586/)" = 403
          test "$(code -d '{"topic":"bram-test","message":"x","actions":[{"action":"http","label":"A","url":"http://127.0.0.1/x","body":"y","clear":true}]}' localhost:2586/)" = 200
          docker compose down
      - name: Stops cleanly
        run: |
          docker run -d --name bram bram-server:local
          sleep 5
          docker logs bram | grep listening
          docker stop -t 10 bram
          test "$(docker inspect -f '{{.State.ExitCode}}' bram)" = 0
  voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -e server
      - run: docker compose -f compose.full.yaml config -q
      - run: docker compose -f compose.voice.yaml up -d
      - run: python scripts/voice_check.py 127.0.0.1:10300 127.0.0.1:10200
      - if: failure()
        run: docker compose -f compose.voice.yaml logs --tail 60
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, home-assistant, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          image=ghcr.io/imcharlieb/bram-server
          docker build --provenance=false -t "$image:edge" -t "$image:sha-$GITHUB_SHA" --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" server
          docker push "$image:sha-$GITHUB_SHA"
          docker push "$image:edge"
  release:
    # Publishes the version in manifest.json once, so HACS can offer it.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - run: |
          version=$(python3 -c "import json; print(json.load(open('custom_components/bram/manifest.json'))['version'])")
          if gh release view "v$version" >/dev/null 2>&1; then exit 0; fi
          # 1.0.0 and later need a test for every hard rule (F9).
          case "$version" in 0.*) ;; *) python3 scripts/rule_coverage.py --release ;; esac
          gh release create "v$version" --target "$GITHUB_SHA" --title "BRAM $version" --notes "Early development. See CHANGELOG.md."
